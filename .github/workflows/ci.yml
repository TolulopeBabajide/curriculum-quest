# Curriculum Quest CI — minimal, green-by-design pipeline (backlog L-01).
# Runs on every push / PR to main and develop. No Azure secrets required:
# the compile smoke check uses compileall (no imports that need creds), and the
# evals run with USE_LOCAL_FALLBACK=true so retrieval uses the local cited
# fallback instead of hitting Foundry IQ / Azure AI Search.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        # Preview pins (agent-framework, azure preview SDKs) are heavy — a slow
        # install here is expected. pytest is not a runtime dep, so install it
        # explicitly for the eval step.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile smoke check
        # compileall catches syntax errors without importing modules that would
        # require Azure credentials or network access — keeps CI green offline.
        run: python -m compileall src conftest.py scripts/seed_foundry_iq.py scripts/create_foundry_iq_kbs.py scripts/gen_assets.py

      - name: Run evals (offline)
        # USE_LOCAL_FALLBACK routes curriculum/world retrieval through the local
        # cited fallback in src/tools/lore.py, so the suite is deterministic and
        # needs no .env / Azure connection.
        env:
          USE_LOCAL_FALLBACK: "true"
        run: pytest evals/ -q

      - name: Secret scan
        # Self-contained (the scanner harness script is gitignored, so the patterns live here) and
        # binary-safe: `grep -I` skips binary files, so the committed web-client PNGs can't
        # false-positive. Exits non-zero only if a hardcoded secret is detected, failing the build.
        run: |
          q="\"'"
          patterns="sk[-_][a-zA-Z0-9]{20,}|AIza[0-9A-Za-z_-]{35}|AKIA[0-9A-Z]{16}|ghp_[a-zA-Z0-9]{36}|xoxb-[0-9]+-[a-zA-Z0-9-]+|-----BEGIN (RSA|EC|OPENSSH) PRIVATE KEY|(password|secret)[$q]?[[:space:]]*[:=][[:space:]]*[$q][^$q]{8,}[$q]|token[$q]?[[:space:]]*[:=][[:space:]]*[$q][a-zA-Z0-9_.-]{20,}[$q]"
          rc=0
          while IFS= read -r f; do
            if grep -IEni -- "$patterns" "$f" >/dev/null 2>&1; then
              echo "::error::possible secret detected in $f"; rc=1
            fi
          done < <(git ls-files)
          exit "$rc"
