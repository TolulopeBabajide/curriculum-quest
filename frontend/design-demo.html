<!-- Demo page for the visual prototypes: loads the SVGs inline, provides expression swapping, parallax, and PNG export buttons -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Curriculum Quest — Design Demo</title>
  <link rel="stylesheet" href="/frontend/css/cq-theme.css">
  <style>
    body { background: var(--cq-bg); font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Arial; color: #111827; padding: 24px; }
    .row { display:flex; gap:24px; align-items:flex-start; }
    .card { background: var(--cq-surface); border-radius: var(--cq-radius); box-shadow: 0 6px 18px rgba(15,23,42,0.06); padding:16px; }
    #scene-root { width: 720px; height: 360px; overflow: hidden; }
    #portrait-root { width: 240px; }
    .controls { display:flex; flex-direction:column; gap:8px; margin-top:8px; }
    button { background: var(--cq-primary); color: white; border: none; padding:8px 12px; border-radius:8px; cursor:pointer; }
    button.secondary { background: #F3F4F6; color: var(--cq-primary); }
    .label { font-size:13px; color:var(--cq-muted); }
  </style>
</head>
<body>
  <h1>Curriculum Quest — Design Demo</h1>
  <p class="label">Interact with the scene and portrait prototypes. Use the export buttons to download PNGs of the inline SVG (client-side).</p>

  <div class="row">
    <div class="card" id="scene-card">
      <div id="scene-root"></div>
      <div class="controls">
        <label><input type="checkbox" id="parallax-toggle" checked> Enable parallax (respect prefers-reduced-motion)</label>
        <button id="export-scene">Export scene PNG</button>
      </div>
    </div>

    <div class="card" id="portrait-card">
      <div id="portrait-root"></div>
      <div class="controls">
        <div>
          <button data-expr="idle">Idle</button>
          <button data-expr="happy">Happy</button>
          <button data-expr="concerned">Concerned</button>
        </div>
        <div>
          <button id="export-portrait">Export portrait PNG</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/frontend/js/design-demo.js"></script>
</body>
</html>
